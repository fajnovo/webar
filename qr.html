<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR kód – WebAR test</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fffaf0; font-family:system-ui,sans-serif; color:#2b2b2b; text-align:center; padding:20px; }
    #qr svg { width:min(80vw,360px); height:auto; background:#fff; border-radius:12px; }
    .hl { background:#e8a317; color:#fff; padding:0 .3em; border-radius:.25em; }
    code { word-break:break-all; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>WebAR <span class="hl">test</span> – QR kód</h1>
    <div id="qr"></div>
    <p>Naskenuj telefónom a otvor odkaz:</p>
    <p><code id="url"></code></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    // QR ukazuje na test (index.html) v tom istom priečinku, kde leží táto stránka.
    var target = new URL('./', location.href).href;
    var qr = qrcode(0, 'M');
    qr.addData(target);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 4 });
    document.getElementById('url').textContent = target;
  </script>
</body>
</html>
